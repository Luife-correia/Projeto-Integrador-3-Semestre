<div class="modal-backdrop" (click)="cancelar()">
  <div class="modal modal-small" role="alertdialog" aria-modal="true" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <h2>{{title}}</h2>
    </header>

    <div class="modal-body">
      <p>{{message}}</p>
    </div>

    <footer class="modal-footer">
      <button type="button" class="button-secondary" (click)="cancelar()">Cancelar</button>
      <button type="button" class="button-danger" (click)="confirmar()">Excluir</button>
    </footer>

  </div>
</div>
