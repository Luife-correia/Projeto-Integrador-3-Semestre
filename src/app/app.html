<header class="topbar">
  <a class="brand" routerLink="/home" aria-label="GameBox início">
    <span class="brand-mark">G<span>.</span></span>
    <span>game<span class="brand-light">box</span></span>
  </a>
  <nav class="main-nav" aria-label="Navegação principal">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Explorar</a>
    <a routerLink="/profile" routerLinkActive="active">Meu perfil</a>
  </nav>
  @if (auth.usuarioAtual; as usuario) {
    <a class="profile-chip" routerLink="/profile"><span>{{ usuario.nome }}</span></a>
    <button class="button-secondary" type="button" (click)="logout()">Sair</button>
  } @else {
    <a class="profile-chip" routerLink="/login"><span>Entrar</span></a>
  }
</header>
<main class="site-main">
  <router-outlet />
</main>
<footer class="site-footer">
  <span>GAMEBOX <span class="footer-dot">•</span> PLATAFORMA DE JOGOS</span>
  <span>Feito para quem joga com atenção.</span>
</footer>
